{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Coaching Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-8">

    <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-md sm:p-8">

        <div class="mb-7 text-center">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-indigo-600 text-white">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Welcome Back</h1>
            <p class="mt-2 text-sm text-slate-500">
                Sign in to access your account
            </p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-5">
                <label for="email" class="mb-2 block text-sm font-medium text-slate-700">
                    Email Address
                </label>
                <input id="email" type="email" name="email" placeholder="Enter your email" autocomplete="email" required
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
            </div>

            <div class="mb-6">
                <label for="password" class="mb-2 block text-sm font-medium text-slate-700">
                    Password
                </label>
                <input id="password" type="password" name="password" placeholder="Enter your password"
                    autocomplete="current-password" required
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
            </div>

            <button type="submit"
                class="w-full rounded-lg bg-indigo-600 py-3 font-semibold text-white transform transition duration-300 hover:scale-105 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Sign In
            </button>
        </form>

        <div class="my-6 flex items-center gap-3">
            <div class="h-px flex-1 bg-slate-200"></div>
            <span class="text-xs text-slate-400">OR</span>
            <div class="h-px flex-1 bg-slate-200"></div>
        </div>
        <a href="{% provider_login_url 'google' %}"
            class="flex w-full items-center justify-center gap-3 rounded-lg border-2 border-red-500 px-4 py-3 text-sm font-semibold text-red-500 transition-all duration-300 hover:scale-105 hover:border-red-600 hover:bg-red-600 hover:text-white focus:outline-none focus:ring-2 focus:ring-red-200">
            <i class="fa-brands fa-google text-lg"></i>
            Continue with Google
        </a>

        <p class="mt-6 text-center text-sm text-slate-500">
            Don't have an account?
            <a href="{% url 'register' %}" class="font-semibold text-indigo-600 hover:text-indigo-800">
                Register
            </a>
        </p>

    </div>

</body>

</html>
