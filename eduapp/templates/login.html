<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center">
    <div class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-center mb-6">Login </h2>
        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block mb-2">Email</label>
                <input type="email" name="email" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div class="mb-5">
                <label class="block mb-2">Password</label>
                <input type="password" name="password" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">
                Login
            </button>
        </form>

        <div class="flex items-center my-5">
            <div class="flex-1 border-t"></div>
            <span class="px-3 text-gray-400 text-sm">OR</span>
            <div class="flex-1 border-t"></div>
        </div>

        <a href="#"
            class="flex items-center justify-center gap-2 w-full border border-gray-300 py-2 rounded-lg hover:bg-red-500 hover:border-red-500 hover:text-olive-50 transition">
            <i class="fa-brands fa-google"></i>
            Continue with Google
        </a>

        <p class="text-center text-sm text-gray-500 mt-5">
            Don't have an account?
            <a href="{% url 'register' %}" class="text-indigo-600 font-semibold">
                Register
            </a>
        </p>

    </div>

</body>

</html>
