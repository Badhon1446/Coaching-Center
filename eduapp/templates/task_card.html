{# Use: {% include '_task_card.html' with task=task %} #}
<div>
  <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 hover:shadow-md hover:border-pink-200 transition">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-pink-400 to-orange-300 flex items-center justify-center text-xl shrink-0">📝</div>
      <div>
        <p class="font-bold text-slate-800">{{ task.title }}</p>
        <span class="inline-block mt-1 text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700">{{ task.subject }}</span>
      </div>
    </div>

    <div class="flex items-center gap-3 flex-wrap">
      <a href="#report-{{ task.id }}" class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-semibold bg-rose-100 text-rose-700 rounded-full hover:bg-rose-200 transition">
        <span class="material-icons text-sm">report</span> Report Issue
      </a>
      <p class="text-sm font-medium text-slate-500 inline-flex items-center gap-1">
        <span class="material-icons text-base">event</span> {{ task.dateline|date:'d M Y' }}
      </p>
    </div>
  </div>

  {# JS charao modal: URL hash (#report-ID) + Tailwind target: variant #}
  <div id="report-{{ task.id }}" class="hidden target:flex fixed inset-0 z-[70] items-center justify-center px-4">
    <a href="#" class="absolute inset-0 bg-slate-900/60" aria-label="Close"></a>
    <div class="relative bg-white rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex items-start justify-between px-6 py-5 bg-gradient-to-r from-rose-100 to-orange-100 rounded-t-3xl">
        <div>
          <h2 class="text-xl font-extrabold text-slate-800">Report an issue</h2>
          <p class="text-sm text-slate-600 mt-1">{{ task.title }}</p>
        </div>
        <a href="#" class="text-slate-500 hover:text-slate-800"><span class="material-icons">close</span></a>
      </div>

      <form method="POST" action="{% url 'submit_task_issue' task.id %}" class="p-6 space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">What is the problem?</label>
          <textarea name="issu" rows="5" required placeholder="Write your problem here..." class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-pink-400 focus:border-pink-400 outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-3">
          <a href="#" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-semibold hover:bg-slate-50">Cancel</a>
          <button type="submit" class="px-5 py-2.5 rounded-xl bg-pink-500 text-white font-semibold hover:bg-pink-600 shadow-md shadow-pink-200">Send to teacher</button>
        </div>
      </form>
    </div>
  </div>
</div>
