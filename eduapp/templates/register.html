<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-800">
                Create Account
            </h1>
            <p class="text-slate-500 mt-2">
                Register for your coaching center account
            </p>
        </div>
        <form method="POST" action="/register/">
            {% csrf_token %}
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required class="w-full px-4 py-3 border border-slate-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-indigo-500
                           focus:border-indigo-500">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email</label>
                <input type="email" name="email" placeholder="Enter your email" required class="w-full px-4 py-3 border border-slate-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-indigo-500
                           focus:border-indigo-500">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Password
                </label>

                <input type="password" name="password1" placeholder="Create a password" required class="w-full px-4 py-3 border border-slate-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-indigo-500
                           focus:border-indigo-500">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Confirem Password
                </label>

                <input type="password" name="password2" placeholder="Create a password" required class="w-full px-4 py-3 border border-slate-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-indigo-500
                           focus:border-indigo-500">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Phone Number
                </label>

                <input type="tel" name="phone" placeholder="01XXXXXXXXX" required class="w-full px-4 py-3 border border-slate-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-indigo-500
                           focus:border-indigo-500">
            </div>
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-700 mb-2">Batch</label>
                <select name="batch" required class="w-full px-4 py-3 border border-slate-300 rounded-lg
                           bg-white focus:outline-none focus:ring-2
                           focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="">Select your batch</option>
                    {% for batch in batches %}
                    <option value="{{ batch.id }}">
                        {{ batch.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    Address
                </label>
                <textarea name="address" rows="3" placeholder="Enter your address" class="w-full px-4 py-3 border border-slate-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-indigo-500
                           focus:border-indigo-500"></textarea>
            </div class="mb-5">
            <div>
                <label>
                    <input type="checkbox" name="checkbox" value="1">
                    Remember me
                </label>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700
                       text-white font-semibold py-3 rounded-lg
                       transition duration-200">
                Create Account
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            Already have an account?
            <a href="#" class="text-indigo-600 font-semibold hover:underline">
                Login
            </a>
        </p>

    </div>

</body>

</html>
